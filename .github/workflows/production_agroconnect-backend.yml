name: Build and deploy JAR app to Azure Web App - agroconnect-backend

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove any cached Maven compiler plugin
        run: rm -rf ~/.m2/repository/org/apache/maven/plugins/maven-compiler-plugin

      - name: Clean and Build with Maven using Java 17
        run: mvn clean install -Dmaven.compiler.release=17 --no-transfer-progress

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D6ECB5C8BAF4A03850B27056021A59F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_12449F7D0C1C4E19810D315131D2333D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_296321C8A5B04453B6DF08F09EEE00F4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'agroconnect-backend'
          slot-name: 'Production'
          package: '*.jar'
